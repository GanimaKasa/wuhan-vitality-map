[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vitality-map"
version = "0.1.0"
description = "武汉城市活力地图 —— 公众问答网站后端"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pandas>=2.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.2",
    "requests>=2.31",
    "python-dotenv>=1.0",
    "numpy>=1.24",
]
# 注意：这里没有sentence-transformers/torch —— 微博语义检索的embedding都改成调用
# SiliconFlow云端embeddings API，不需要本地跑模型，部署环境(Render免费档512MB)也
# 能轻松装下。torch/geopandas这类只有backend/scripts/离线脚本才需要的重依赖，不放
# 进这份运行时依赖清单，避免部署镜像被拖累。

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.4",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 110
target-version = "py311"
