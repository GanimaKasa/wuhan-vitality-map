[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vitality-map"
version = "0.1.0"
description = "武汉城市活力地图 —— 公众问答网站后端"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pandas>=2.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.2",
    "requests>=2.31",
    "python-dotenv>=1.0",
    "numpy>=1.24",
    # 模式B(multi-agent)用：create_agent/AgentState/ToolRuntime都来自langchain
    # 这个统一包(1.x新API，不是旧版langgraph.prebuilt.ToolNode手搭StateGraph)，
    # langgraph/langchain-openai是它的底层依赖，一并显式声明版本下限
    "langchain>=1.3",
    "langgraph>=1.2",
    "langchain-openai>=1.5",
    # ask_user中途反问的暂停/恢复用，本地开发默认SQLite；部署到Render等容器
    # 重启会丢盘的环境时，换成langgraph-checkpoint-postgres+真Postgres实例
    "langgraph-checkpoint-sqlite>=3.0",
]
# 注意：这里没有sentence-transformers/torch —— 微博语义检索的embedding都改成调用
# SiliconFlow云端embeddings API，不需要本地跑模型，部署环境(Render免费档512MB)也
# 能轻松装下。torch/geopandas这类只有backend/scripts/离线脚本才需要的重依赖，不放
# 进这份运行时依赖清单，避免部署镜像被拖累。

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.4",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 110
target-version = "py311"
